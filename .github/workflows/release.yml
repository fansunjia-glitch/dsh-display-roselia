name: Release plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, matching package.json version'
        required: true
        default: 'v0.2.0'
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate requested tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            printf '%s\n' 'Release tag must be vMAJOR.MINOR.PATCH, optionally with a prerelease or build suffix.' >&2
            exit 1
          fi
          printf 'value=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.value }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          package-manager-cache: false

      - name: Verify package version and tag commit
        id: package
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync, appendFileSync } from 'node:fs'
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.equal(manifest.name, 'dsh-display-roselia', 'Unexpected package name')
          assert.equal(`v${manifest.version}`, process.env.RELEASE_TAG, 'Tag and package version differ')
          appendFileSync(process.env.GITHUB_OUTPUT, `filename=${manifest.name}-${manifest.version}.tgz\n`)
          NODE

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build and test
        run: npm test

      - name: Pack and checksum
        env:
          PACKAGE_FILENAME: ${{ steps.package.outputs.filename }}
        run: |
          set -euo pipefail
          mkdir -p release
          npm pack --pack-destination release
          cd release
          test -f "$PACKAGE_FILENAME"
          sha256sum "$PACKAGE_FILENAME" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
          PACKAGE_FILENAME: ${{ steps.package.outputs.filename }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const { GH_REPO, RELEASE_TAG, PACKAGE_FILENAME, RUNNER_TEMP } = process.env
          const base = `https://github.com/${GH_REPO}/blob/${encodeURIComponent(RELEASE_TAG)}`
          const notes = [
            'Roselia · Nocturne / 夜曲：随机成员舞台与按需推理浮层。',
            '',
            '下载 `' + PACKAGE_FILENAME + '` 与 `SHA256SUMS`，在同一目录校验后通过官方 CLI 安装（示例 profile 为 web）：',
            '',
            '```sh',
            'shasum -a 256 -c SHA256SUMS',
            `dsh plugin --profile web add "./${PACKAGE_FILENAME}"`,
            '```',
            '',
            '安装后按原方式重启 DSH；Electron Desktop 使用其自带的 CLI。',
            '',
            `[使用说明](${base}/README.md) · [验证记录](${base}/VERIFICATION.md) · [素材出处](${base}/ATTRIBUTION.md)`,
            '',
            '这是非官方个人主题，官方角色、图片与商标权利归原权利人所有。',
            '',
          ].join('\n')
          writeFileSync(join(RUNNER_TEMP, 'release-notes.md'), notes)
          NODE

          metadata="$RUNNER_TEMP/roselia-release.json"
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft,url > "$metadata"; then
            # Upload while still a draft, before optional release immutability applies.
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --verify-tag --draft \
              --title "Roselia · 夜曲 $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft,url > "$metadata"
          fi

          # No --clobber: existing assets are preserved and duplicate uploads fail.
          gh release upload "$RELEASE_TAG" "release/$PACKAGE_FILENAME" 'release/SHA256SUMS' --repo "$GH_REPO"

          if [[ "$(jq --raw-output '.isDraft' "$metadata")" == 'true' ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
          fi
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
